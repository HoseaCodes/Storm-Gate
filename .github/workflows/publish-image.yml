name: Publish image

# Storm-Gate is consumed as a container by OpsAtlas, which needs an identity
# provider it can start from compose. Published from CI rather than from a
# laptop so that what runs is built from a commit anyone can check out, by a
# process anyone can read.
#
# Each architecture is built on a runner of its own architecture and pushed by
# digest; a final job stitches the digests into one manifest list under the real
# tags. The single emulated job this replaces built amd64 natively and arm64
# under QEMU, where it spent thirteen minutes before QEMU killed it with an
# illegal instruction - emulated Node is not a thing to bet a release on. The
# arm64 runners are free for public repositories, which this is.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Written out rather than derived from github.repository, which keeps the
  # owner's capitalisation - and a container registry refuses an uppercase
  # repository name outright. Deriving it meant lower-casing in a shell step and
  # reading that step's output back in `with:` blocks, which is two failures
  # deep: the first publish emitted uppercase tags, and the second emitted none
  # at all because the output came back empty.
  #
  # A literal cannot arrive empty. The cost is that renaming or forking this
  # repository means editing this line, which is a visible, one-line cost rather
  # than a silent midnight one.
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/hoseacodes/storm-gate

jobs:
  # An image is not published unless the suite that covers token signing and key
  # management passes. A broken authentication service that starts is worse than
  # one that does not. Its own job, on one runner: the tests are the same on
  # every architecture, and running them per-architecture only buys two chances
  # to flake.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

      # Fails the build on a known-vulnerable production dependency. `--omit=dev`
      # because a test-only advisory is not something a running container ships,
      # and failing on it would train everyone to pass `--force`.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # The only write this workflow has, and it is the one it needs.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # `linux/amd64` is not a legal artifact name.
      - name: Name this platform
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      # github.repository is mixed case and GHCR paths are not. metadata-action
      # lower-cases this for us, but the digest push below names the repository
      # directly and so has to do it itself.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only for the labels here. The tags belong to the manifest list, not to
      # either of the single-architecture images underneath it.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform: one shared scope means each architecture keeps
          # evicting the other's layers and neither ever gets a cache hit.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Until this runs, the two builds above are untagged digests that nothing
  # points at. This is the step that publishes.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          # Either shape metadata-action might emit.
          #
          # It writes DOCKER_METADATA_OUTPUT_JSON as {"tags":[...],"labels":{...}}.
          # The widely copied snippet for this job reads
          # `.target."docker-metadata-action".tags`, which is the *bake file*
          # layout - a different output of the same action. Against the real
          # output that path is null, so the tags were computed correctly,
          # lower-cased and all, and then thrown away by the filter meant to read
          # them. Accepting both costs one `//` and survives the action changing
          # its mind.
          tags=$(jq -cr '(.tags // .target."docker-metadata-action".tags // []) | map("-t " + .) | join(" ")' \
            <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$tags" ]; then
            echo "::error::metadata-action produced no tags, so there is nothing to publish under." >&2
            echo "Its output was:" >&2
            echo "$DOCKER_METADATA_OUTPUT_JSON" >&2
            exit 1
          fi

          digests=$(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
          if [ "$digests" = '${{ env.IMAGE_NAME }}@sha256:* ' ]; then
            echo "::error::No per-platform digests were downloaded; the build jobs published nothing." >&2
            exit 1
          fi

          echo "Tagging $digests as: $tags"
          docker buildx imagetools create $tags $digests

      # Cheap, and it is the only thing that proves both architectures actually
      # made it into the tag people will pull.
      - name: Inspect the published image
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
